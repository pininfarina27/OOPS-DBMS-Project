<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Car Rental System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
    <div class="sidebar">
        <div class="sidebar-header">🚗 Car Rental</div>
        <nav class="sidebar-nav">
            <ul>
                <li><a href="index.html">📊 Dashboard</a></li>
                <li><a href="cars.html">🚘 Cars</a></li>
                <li><a href="customers.html">👥 Customers</a></li>
                <li><a href="rentals.html">📋 Rentals</a></li>
                <li><a href="history.html">📜 History</a></li>
                <li><a href="reports.html">📈 Reports</a></li>
            </ul>
        </nav>
    </div>

    <div class="main-content">
        <div class="page-header">
            <h1>Dashboard</h1>
        </div>

        <div class="stats-grid">
            <div class="stat-card" id="totalCarsCard">
                <div class="stat-icon">🚘</div>
                <div class="stat-number" id="totalCarsNum">0</div>
                <div class="stat-label">Total Cars</div>
            </div>
            <div class="stat-card" id="availableCarsCard">
                <div class="stat-icon">✅</div>
                <div class="stat-number" id="availableCarsNum">0</div>
                <div class="stat-label">Available Cars</div>
            </div>
            <div class="stat-card" id="activeRentalsCard">
                <div class="stat-icon">📋</div>
                <div class="stat-number" id="activeRentalsNum">0</div>
                <div class="stat-label">Active Rentals</div>
            </div>
            <div class="stat-card" id="totalRevenueCard">
                <div class="stat-icon">💰</div>
                <div class="stat-number" id="totalRevenueNum">0</div>
                <div class="stat-label">Total Revenue</div>
            </div>
        </div>

        <div class="card">
            <h3>Recent Rentals</h3>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Customer</th>
                            <th>Car</th>
                            <th>Rental Date</th>
                            <th>Status</th>
                            <th>Amount</th>
                        </tr>
                    </thead>
                    <tbody id="recentRentalsBody">
                        <tr>
                            <td colspan="6" style="text-align: center;">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div><!-- end main-content -->
    </div><!-- end app-container -->

    <script src="js/common.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
